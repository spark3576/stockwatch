<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 카드 아카이브 — StockWatch</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
<script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen antialiased">

<header class="sticky top-0 z-20 backdrop-blur bg-zinc-950/80 border-b border-zinc-800">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-4">
    <a href="index.html" class="text-zinc-400 hover:text-zinc-100 text-sm">← 메인</a>
    <h1 class="font-bold text-lg">📚 카드 아카이브</h1>
    <span class="text-xs text-zinc-500" id="meta"></span>
    <nav class="ml-auto flex gap-3 text-xs">
      <a href="index.html" class="text-zinc-400 hover:text-zinc-100">최신</a>
      <a href="archive.html" class="text-blue-400">아카이브</a>
    </nav>
  </div>
</header>

<div class="max-w-6xl mx-auto px-4 py-3 border-b border-zinc-800">
  <div class="flex flex-wrap gap-2">
    <input id="search" type="text" placeholder="🔍 종목 검색"
      class="flex-1 min-w-[180px] bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm placeholder-zinc-500 focus:outline-none focus:border-blue-500">
    <select id="market" class="bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm">
      <option value="">🌍 전체</option>
      <option value="KR">🇰🇷 KR</option><option value="US">🇺🇸 US</option>
      <option value="JP">🇯🇵 JP</option><option value="UK">🇬🇧 UK</option><option value="DE">🇩🇪 DE</option>
    </select>
    <select id="verdict" class="bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm">
      <option value="">⚖️ 모든 판정</option>
      <option value="강한 상승">🟢🟢 강한 상승</option>
      <option value="상승">🟢 상승</option>
      <option value="혼조">🟡 혼조</option>
      <option value="하락">🔴 하락</option>
      <option value="강한 하락">🔴🔴 강한 하락</option>
    </select>
    <input id="from" type="date" class="bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm" title="시작일">
    <input id="to" type="date" class="bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm" title="종료일">
  </div>
</div>

<div id="stats" class="max-w-6xl mx-auto px-4 py-2 text-xs text-zinc-500"></div>

<main class="max-w-6xl mx-auto px-4 pb-8">
  <div id="list" class="bg-zinc-900 rounded-lg overflow-hidden"></div>
  <div id="empty" class="hidden text-center py-16 text-zinc-500">조건 일치 카드 없음</div>
</main>

<script src="app.js"></script>
<script>
let ALL = [];
async function load() {
  ALL = await fetch('data/cards_all.json').then(r => r.json());
  const dates = ALL.map(c => c.date).filter(Boolean);
  if (dates.length) {
    document.getElementById('from').value = dates[dates.length-1];
    document.getElementById('to').value = dates[0];
  }
  document.getElementById('meta').textContent = `${ALL.length}건 누적`;
  apply();
}
function apply() {
  const search = document.getElementById('search').value.trim().toLowerCase();
  const market = document.getElementById('market').value;
  const verdict = document.getElementById('verdict').value;
  const from = document.getElementById('from').value;
  const to = document.getElementById('to').value;

  let f = ALL.filter(c => {
    if (search && !(c.name||'').toLowerCase().includes(search) && !(c.symbol||'').toLowerCase().includes(search)) return false;
    if (market && c.market !== market) return false;
    if (verdict) {
      if (verdict === '상승' && !c.verdict.includes('상승')) return false;
      if (verdict === '하락' && !c.verdict.includes('하락')) return false;
      if (verdict === '강한 상승' && !c.verdict.includes('강한 상승')) return false;
      if (verdict === '강한 하락' && !c.verdict.includes('강한 하락')) return false;
      if (verdict === '혼조' && !c.verdict.includes('혼조')) return false;
    }
    if (from && c.date < from) return false;
    if (to && c.date > to) return false;
    return true;
  });

  document.getElementById('stats').textContent = `${f.length} / ${ALL.length}건 표시`;
  document.getElementById('empty').classList.toggle('hidden', f.length > 0);

  const flag = (m) => ({KR:'🇰🇷',US:'🇺🇸',JP:'🇯🇵',UK:'🇬🇧',DE:'🇩🇪'})[m]||'';
  document.getElementById('list').innerHTML = f.map((c, i) => {
    const net = c.scores.up - c.scores.down;
    const total = c.scores.up + c.scores.down + c.scores.neut || 1;
    const upPct = c.scores.up / total * 100;
    const downPct = c.scores.down / total * 100;
    const time = (c.issued_at||'').split(' ')[1]?.slice(0,5) || '';
    return `<a href="card.html?id=${c.id}" class="block px-3 py-2.5 ${i>0?'border-t border-zinc-800':''} hover:bg-zinc-800/50 transition">
      <div class="flex items-center gap-3">
        <div class="text-xs text-zinc-500 w-24 shrink-0">${c.date} ${time}</div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2">
            <span class="text-xs">${flag(c.market)}</span>
            <span class="font-medium truncate">${c.name}</span>
            <span class="text-xs font-mono text-zinc-500">${c.symbol}</span>
          </div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <div class="flex h-1.5 w-20 rounded-full overflow-hidden bg-zinc-800">
            <div class="bg-emerald-500" style="width:${upPct}%"></div>
            <div class="bg-red-500" style="width:${downPct}%"></div>
            <div class="bg-yellow-500" style="width:${100-upPct-downPct}%"></div>
          </div>
          <div class="font-mono text-xs w-16 text-right">net ${net>=0?'+':''}${net}</div>
          <div class="text-xs ${badgeClass(c.verdict)} px-2 py-0.5 rounded font-medium w-24 text-center">${c.verdict_emoji} ${c.verdict.slice(0,4)}</div>
        </div>
      </div>
    </a>`;
  }).join('');
}
['search','market','verdict','from','to'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('input', apply);
  el.addEventListener('change', apply);
});
load();
</script>
</body>
</html>
